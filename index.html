<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>UltraGauche Force</title>
  <meta name="description" content="Run-and-gun satirique, libre et collaboratif. Taxez les riches, abattez la Citadelle.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="UltraGauche Force">
  <meta property="og:description" content="Taxez les riches. Abattez la Citadelle. Un run-and-gun satirique et libre, à jouer dans le navigateur.">
  <meta property="og:url" content="https://macraoke.github.io/ultragaucheforce/">
  <meta property="og:image" content="https://macraoke.github.io/ultragaucheforce/apercu.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:locale" content="fr_FR">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="theme-color" content="#1a1c2c">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icone-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <!-- mesure d’audience : ajoutée par le build -->
  <!-- Le contenu part dès la lecture de la page, sans attendre la feuille de style ni les modules ; main.js reprend cette requête. -->
  <script>window.contentRequest = fetch('content.json');</script>
  <link rel="stylesheet" href="style.css">
</head>
<body class="jeu">
  <div id="app">
    <div id="scene">
      <canvas id="monde" class="pixel"></canvas>
      <canvas id="textes"></canvas>

      <div id="hud" hidden>
        <div class="bloc gauche">
          <span id="hud-heros"></span>
          <span id="hud-vies"></span>
          <span id="hud-charges"></span>
          <span id="hud-manif" hidden></span>
        </div>
        <div class="bloc droite">
          <button id="edition" type="button" hidden>← Retour à l’édition</button>
          <button id="pause" type="button" aria-label="Pause">II</button>
        </div>
        <div id="hud-boss" hidden><b></b><span><i></i></span></div>
      </div>

      <div id="bandeau" hidden data-niveau="0">
        <strong class="chaine"><i></i>PANIQUE <b>TV</b></strong>
        <span id="hud-panique" data-niveau="0" role="img" aria-label="Panique de la chaîne : calme"><i>Calme</i><i>Alerte</i><i>Hystérie</i></span>
        <em>ALERTE INFO</em>
        <span class="fil"></span>
      </div>
      <div id="toasts"></div>
    </div>

    <div id="tactile" aria-hidden="true">
      <i class="manche"><i></i></i>
      <b data-action="fire">TIR</b>
      <b data-action="jump">SAUT</b>
      <b data-action="special">SPÉ</b>
    </div>
  </div>

  <!-- Le titre se montre dès la page reçue, pendant le chargement du jeu ; le menu prend sa place. -->
  <div id="ecran">
    <section class="panneau menu chargement">
      <div class="logo"><span>UltraGauche</span><span>Force</span></div>
      <p class="devise">Taxez les riches. Abattez la Citadelle.</p>
      <noscript><p class="mention">UltraGauche Force a besoin de JavaScript pour fonctionner. <a href="mentions-legales.html">Mentions légales</a></p></noscript>
    </section>
  </div>
  <div id="radio" hidden></div>

  <script type="module" src="src/client/main.js"></script>
</body>
</html>
