name: Un niveau
description: Une idée de niveau, ou un niveau fait dans l'Atelier.
title: "Niveau : "
labels: ["niveau"]
body:
  - type: input
    id: titre
    attributes:
      label: Le titre
    validations:
      required: true
  - type: textarea
    id: idee
    attributes:
      label: L'idée
      description: Le lieu, qui on y recrute, quelle ligne on y déborde, ce qu'on y casse.
    validations:
      required: true
  - type: textarea
    id: reference
    attributes:
      label: La déclaration ou le fait réel qui l'ouvre, avec sa source
  - type: textarea
    id: fichier
    attributes:
      label: Le niveau, si vous l'avez dessiné
      description: Collez le texte de l'Atelier.
      render: text
