name: Une pancarte ou un bandeau
description: Une pancarte vue en manif, un slogan scandé, un bandeau de chaîne d'info. Une ligne suffit.
title: "Pancarte : "
labels: ["blague"]
body:
  - type: dropdown
    id: genre
    attributes:
      label: C'est…
      options:
        - une pancarte vue en manif
        - un slogan scandé en manif
        - un bandeau vu sur une chaîne d'info
    validations:
      required: true
  - type: textarea
    id: texte
    attributes:
      label: Le texte exact
      description: Mot pour mot. Une par ligne.
      placeholder: TU NOUS METS 64 ANS, ON TE MAI 68
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Où, quand, et le lien
      description: La ville et la date pour une pancarte ou un slogan ; la chaîne et le jour pour un bandeau.
      placeholder: "vue à Paris, mars 2023 — https://…"
    validations:
      required: true
