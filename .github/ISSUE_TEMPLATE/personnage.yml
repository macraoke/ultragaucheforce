name: Un personnage
description: Un héros, une recrue, une unité d'en face ou un boss.
title: "Personnage : "
labels: ["personnage"]
body:
  - type: dropdown
    id: role
    attributes:
      label: Son rôle
      options:
        - héros
        - recrue de la manif
        - unité d'en face
        - boss
    validations:
      required: true
  - type: input
    id: nom
    attributes:
      label: Son nom
      placeholder: La Casserolière
    validations:
      required: true
  - type: textarea
    id: gag
    attributes:
      label: Le gag, en trois secondes
    validations:
      required: true
  - type: textarea
    id: gameplay
    attributes:
      label: Ce qu'il fait dans le jeu
      description: Son arme, sa spéciale, sa façon de bouger ; pour une recrue, combien elle amène de monde.
    validations:
      required: true
  - type: input
    id: inspiration
    attributes:
      label: Personnalité publique caricaturée, s'il y en a une
  - type: textarea
    id: sources
    attributes:
      label: Citations, slogans ou chiffres réels utilisés, avec leurs sources
      description: Une adresse par ligne.
